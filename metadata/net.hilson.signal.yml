License: AGPL-3.0-only
Name: Signal (Hilson fork)
Summary: Signal with a remembered video-call self-view corner
Description: |-
  Fork of Signal-Android that remembers which corner the video-call self-view
  was dragged to, across calls and app restarts.

  This build uses its own application ID and signing key, so it installs
  separately from the official Signal and must be registered on its own.
